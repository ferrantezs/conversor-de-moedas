<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Moedas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="main-header glass">
    <nav class="nav-bar">
      <a href="home.html" class="logo">💱 Conversor</a>
      <ul class="nav-links">
        <li><a href="#historico">Histórico</a></li>
        <li><a href="index.html">Sair</a></li>
      </ul>
      <button id="toggleTheme" class="theme-toggle" aria-label="Alternar tema">🌙</button>
    </nav>
  </header>

  <div class="page-wrapper">
    <main class="main-content">

      <!-- Converter -->
      <section class="card glass converter-card">
        <div class="card-header">
          <h1>Conversor de Moedas</h1>
          <p id="saudacao" class="greeting"></p>
        </div>

        <div class="converter-form">
          <input type="number" id="amount" placeholder="Digite o valor" min="0" />

          <div class="currency-row">
            <select id="fromCurrency"></select>
            <button id="swapBtn" class="swap-btn" title="Trocar moedas">⇄</button>
            <select id="toCurrency"></select>
          </div>

          <button id="convertBtn" class="btn-primary full">Converter</button>
        </div>

        <div id="resultArea" class="result-area hidden">
          <div class="main-result">
            <span id="resultText"></span>
            <button id="copyBtn" class="icon-btn" title="Copiar resultado">📋</button>
          </div>
          <p id="rateInfo" class="rate-info"></p>
        </div>
      </section>

      <!-- Outras moedas -->
      <section id="multiResultSection" class="card glass hidden">
        <h2 class="section-title">Outras moedas</h2>
        <div id="multiGrid" class="multi-grid"></div>
      </section>

      <!-- Gráfico -->
      <section class="card glass">
        <h2 class="section-title">Taxa comparativa</h2>
        <canvas id="chart"></canvas>
      </section>

      <!-- Histórico -->
      <section id="historico" class="card glass">
        <div class="section-header">
          <h2 class="section-title">Histórico</h2>
          <button id="clearHistoryBtn" class="btn-ghost">Limpar</button>
        </div>
        <ul id="history" class="history-list">
          <li class="history-empty">Nenhuma conversão ainda.</li>
        </ul>
      </section>
    </main>

    <!-- Notícias -->
    <aside class="news-panel glass">
      <h2 class="section-title">Notícias do Mercado</h2>
      <ul id="news-list">
        <li>⏳ Carregando notícias...</li>
      </ul>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
  <script>
    const toggleBtn = document.getElementById('toggleTheme');
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      toggleBtn.textContent = '🌞';
    }
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      toggleBtn.textContent = isDark ? '🌞' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
  </script>
</body>
</html>
